[project]
name = "miniquant"
version = "0.1.0"
description = ""
authors = [
    {name = "uChicoPrograming",email = "franciscobusiness3007@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "pandas (<3.0.0)",
    "fastapi[standard] (>=0.129.0,<0.130.0)",
    "uvicorn[standard] (>=0.41.0,<0.42.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "yfinance (>=1.2.0,<2.0.0)",
    "streamlit (>=1.54.0,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "plotly (>=6.5.2,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "ruff (>=0.15.1,<0.16.0)"
]


[tool.ruff]
line-length = 79


[tool.ruff.lint]
preview = true


[tool.ruff.format]
preview = true


[tool.pytest.ini_options]
pythonpath = "."


[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev app/main.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=app -vv'
post_test = 'coverage html'